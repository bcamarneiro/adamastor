name: Sync Deputy Photos

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  sync-photos:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Get latest release tag (production only)
        if: inputs.environment == 'production'
        id: latest_release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            if (releases.data.length === 0) {
              core.setFailed('No releases found. Create a release first.');
              return;
            }
            const tag = releases.data[0].tag_name;
            core.setOutput('tag', tag);
            console.log(`Using release: ${tag}`);

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.environment == 'production' && steps.latest_release.outputs.tag || 'staging' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: apps/watcher

      - name: Sync photos to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Syncing photos for $ENVIRONMENT..."
          bun run src/sync-photos.ts --force
        working-directory: apps/watcher
