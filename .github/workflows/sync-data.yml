name: Sync Data

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6 AM UTC (staging)
    - cron: "0 7 * * *" # Daily at 7 AM UTC (production)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      force:
        description: 'Force full sync (ignore hash comparison)'
        type: boolean
        default: false
      sync_photos:
        description: 'Also sync deputy photos to Supabase Storage'
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      force:
        required: false
        type: boolean
        default: false
      sync_photos:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  # Determine which environment to sync based on trigger
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Check which cron triggered this
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "06" ]; then
              echo "environment=staging" >> $GITHUB_OUTPUT
            else
              echo "environment=production" >> $GITHUB_OUTPUT
            fi
          elif [ -n "${{ inputs.environment }}" ]; then
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  sync:
    runs-on: ubuntu-latest
    needs: determine-environment
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      # For production: checkout the latest release tag
      - name: Get latest release tag (production only)
        if: needs.determine-environment.outputs.environment == 'production'
        id: latest_release
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            if (releases.data.length === 0) {
              console.log('No releases found. Skipping production sync.');
              core.setOutput('skip', 'true');
              return;
            }
            const tag = releases.data[0].tag_name;
            core.setOutput('tag', tag);
            core.setOutput('skip', 'false');
            console.log(`Using release: ${tag}`);

      - name: Skip if no release (production)
        if: needs.determine-environment.outputs.environment == 'production' && steps.latest_release.outputs.skip == 'true'
        run: |
          echo "::warning::No releases found. Create a release first before production can sync."
          exit 0

      # Checkout appropriate ref based on environment
      - name: Checkout code
        if: needs.determine-environment.outputs.environment != 'production' || steps.latest_release.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-environment.outputs.environment == 'production' && steps.latest_release.outputs.tag || 'staging' }}

      - name: Setup Bun
        if: needs.determine-environment.outputs.environment != 'production' || steps.latest_release.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: needs.determine-environment.outputs.environment != 'production' || steps.latest_release.outputs.skip != 'true'
        run: bun install
        working-directory: apps/watcher

      - name: Cache snapshots
        if: needs.determine-environment.outputs.environment != 'production' || steps.latest_release.outputs.skip != 'true'
        uses: actions/cache@v5
        with:
          path: apps/watcher/snapshots
          key: sync-snapshots-${{ needs.determine-environment.outputs.environment }}-${{ github.run_id }}
          restore-keys: |
            sync-snapshots-${{ needs.determine-environment.outputs.environment }}-

      - name: Verify Parliament API availability
        if: needs.determine-environment.outputs.environment != 'production' || steps.latest_release.outputs.skip != 'true'
        id: api_health
        run: |
          echo "Checking Parliament API availability..."
          MAX_RETRIES=5
          BASE_DELAY=10

          # Test one of the data endpoints (informacao_base - most critical)
          API_URL="https://app.parlamento.pt/webutils/docs/doc.txt?path=a4zfhVMRlkdx8PM4w%2fg1C1Vt1TLL3nxEyDWBwgqjBdJ7w%2f%2bbRwjvq2lIPr1xRzJ6DBy%2fOxQCKfWDla%2fScSjS6%2f0N3a%2b%2b%2bTVRcUvCJTkFrTAUT%2bpzIFRAScSKhiWv2HGWkAHIxlwTIeOsSOOsrXmbVE%2bHE%2fHLJ6RWbSsJBaLWq70lF4rBy8G6GbdPHdrrdiatO%2fCimTiuyO8Wki6C7zu5Klq5f53YZ%2b4MtX8FF5lC1pyiQrC%2bwSVBcu%2brHigPkI56fz8xBGvxVgoQ0nQdAuby1qmhEyYT6RCxaQAqbqv0m70pJF19SyzE62kUF%2fYRio8PiC5DjRA4%2b2eF1X7FfO4s7Bfcq7lsR9LR2PCbXn9zBNQ9mqEnp0H%2brT%2f5vD%2fgcT%2bzF3SPcKfuZKhhDvK1cBgse9ktAzWSZxzzqgCqsUeQ760%3d&fich=InformacaoBaseXVII_json.txt&Inline=true"

          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES: Testing Parliament API..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$API_URL" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Parliament API is available (HTTP $HTTP_CODE)"
              echo "api_available=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "⚠️ Parliament API returned HTTP $HTTP_CODE"

            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              # Calculate exponential backoff: 10s → 20s → 40s → 80s
              RETRY_DELAY=$((BASE_DELAY * (2 ** (attempt - 1))))

              # Apply 2x multiplier for rate limiting (HTTP 403)
              if [ "$HTTP_CODE" = "403" ]; then
                RETRY_DELAY=$((RETRY_DELAY * 2))
                echo "⚠️ Rate limiting detected (403) - applying extended backoff"
              fi

              # Add jitter (±20%) to prevent synchronized retries
              JITTER=$((RETRY_DELAY / 5))  # 20% of delay
              RANDOM_OFFSET=$((RANDOM % (JITTER * 2 + 1) - JITTER))
              RETRY_DELAY=$((RETRY_DELAY + RANDOM_OFFSET))

              # Cap maximum delay at 180s (3 minutes)
              if [ "$RETRY_DELAY" -gt 180 ]; then
                RETRY_DELAY=180
              fi

              echo "Waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Parliament API unavailable after $MAX_RETRIES attempts"
          echo "api_available=false" >> $GITHUB_OUTPUT
          echo "::error::Parliament API is unavailable. The sync cannot proceed. This may be a temporary outage - please retry later."
          exit 1

      - name: Sync data
        if: needs.determine-environment.outputs.environment != 'production' || steps.latest_release.outputs.skip != 'true'
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
        run: |
          echo "Syncing to $ENVIRONMENT"
          FORCE_FLAG="${{ inputs.force }}"
          if [ "$FORCE_FLAG" = "true" ]; then
            echo "Force mode enabled - running full sync"
            bun run start -- --force
          else
            bun run start
          fi
        working-directory: apps/watcher

      - name: Sync photos to Supabase Storage
        if: needs.determine-environment.outputs.environment != 'production' || steps.latest_release.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENVIRONMENT: ${{ needs.determine-environment.outputs.environment }}
        run: |
          echo "Syncing photos for $ENVIRONMENT..."
          # Only use --force if explicitly requested, otherwise incremental sync
          # (skips deputies that already have Supabase Storage URLs)
          if [ "${{ inputs.sync_photos }}" = "true" ]; then
            bun run src/sync-photos.ts --force
          else
            bun run src/sync-photos.ts
          fi
        working-directory: apps/watcher

      # Smoke test for production
      - name: Smoke test (production only)
        if: needs.determine-environment.outputs.environment == 'production' && steps.latest_release.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Running smoke tests..."

          DEPUTY_COUNT=$(curl -s \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/deputies?select=id&is_active=eq.true&limit=1" \
            -w "\n%{http_code}" | tail -1)

          if [ "$DEPUTY_COUNT" != "200" ]; then
            echo "Failed to query deputies table (HTTP $DEPUTY_COUNT)"
            exit 1
          fi

          STATS_COUNT=$(curl -s \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/deputy_stats?select=id&limit=1" \
            -w "\n%{http_code}" | tail -1)

          if [ "$STATS_COUNT" != "200" ]; then
            echo "Failed to query deputy_stats table (HTTP $STATS_COUNT)"
            exit 1
          fi

          echo "Smoke tests passed"

      - name: Notify on failure
        if: failure() && (needs.determine-environment.outputs.environment != 'production' || steps.latest_release.outputs.skip != 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const env = '${{ needs.determine-environment.outputs.environment }}';
            const labels = ['bug', 'sync'];
            if (env === 'production') labels.push('production');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Sync failed (${env}) - ${new Date().toISOString().split('T')[0]}`,
              body: `The ${env} sync workflow failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: labels
            });
