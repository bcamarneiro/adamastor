name: Release to Production

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

# Prevent concurrent releases
concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Mandatory E2E tests against staging before production release
  e2e-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: staging

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        run: |
          bunx playwright install-deps chromium
          bunx playwright install chromium

      - name: Run smoke tests against staging
        run: bun run e2e:smoke
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: https://adamastor-staging.vercel.app

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report-staging
          path: apps/web/playwright-report/
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    environment: production
    needs: e2e-staging
    steps:
      - name: Checkout staging
        uses: actions/checkout@v6
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify CI passed on staging
        run: |
          COMMIT=$(git rev-parse HEAD)
          echo "Checking CI status for commit: $COMMIT"

          # Only check these specific CI workflow jobs
          REQUIRED_CHECKS='["lint-and-typecheck", "test-watcher", "test-web", "build", "e2e", "db-migrations"]'

          # Get all check runs
          ALL_CHECKS=$(gh api repos/${{ github.repository }}/commits/$COMMIT/check-runs --jq '.check_runs')

          # Filter to only the required CI checks
          CHECKS=$(echo "$ALL_CHECKS" | jq --argjson required "$REQUIRED_CHECKS" '[.[] | select(.name as $n | $required | index($n))]')
          TOTAL=$(echo "$CHECKS" | jq 'length')

          echo "Found $TOTAL of ${#REQUIRED_CHECKS[@]} required CI checks"

          # Show individual check results
          echo "$CHECKS" | jq -r '.[] | "\(.name): \(.conclusion)"'

          # Count checks that passed (success) or were skipped (acceptable)
          PASSED=$(echo "$CHECKS" | jq '[.[] | select(.conclusion == "success" or .conclusion == "skipped")] | length')

          # Count checks that failed or are still running
          FAILED=$(echo "$CHECKS" | jq '[.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null)] | length')
          PENDING=$(echo "$CHECKS" | jq '[.[] | select(.conclusion == null)] | length')

          echo "Check results: $PASSED passed/skipped, $FAILED failed, $PENDING pending"

          if [ "$PENDING" != "0" ]; then
            echo "::error::Some CI checks are still running"
            exit 1
          fi

          if [ "$FAILED" != "0" ]; then
            echo "::error::CI checks failed on staging"
            exit 1
          fi

          if [ "$TOTAL" = "0" ]; then
            echo "::error::No CI checks found on staging. Run CI first."
            exit 1
          fi

          echo "All required CI checks passed or skipped"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Bump version and prepare release
        id: version
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Bump version in package.json (using jq to avoid npm dependency resolution)
          cd apps/web
          OLD_VERSION=$(jq -r .version package.json)

          # Parse version and bump accordingly
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"
          case "${{ inputs.version_type }}" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          # Update package.json with jq
          jq --arg v "$NEW_VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped $OLD_VERSION → $NEW_VERSION"
          cd ../..

          # Commit version bump locally (not pushed yet)
          git add -A
          git commit -m "chore: bump version to v${NEW_VERSION}"

          # Fetch and merge to main locally
          git fetch origin main
          git checkout main
          git merge staging --ff-only

          # Create tag locally
          git tag "v${NEW_VERSION}"

          echo "All local preparations complete. Ready to push."

      - name: Push release to main
        run: |
          # Push main and tag atomically - this is the point of no return
          git push origin main --tags

      - name: Update staging branch
        run: |
          # Now update staging to match main (includes version bump)
          git checkout staging
          git push origin staging

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy DB to production
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Trigger production data sync
        run: |
          gh workflow run sync-data.yml -f environment=production || echo "Sync workflow not found or failed to trigger"
        env:
          GH_TOKEN: ${{ github.token }}
