name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  # Security: Scan for leaked secrets
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for comprehensive scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Note: All jobs share the same cache key because this monorepo uses a single
      # root-level bun.lock for all workspaces. Each workspace install downloads
      # from the same global cache, so sharing the key is safe and more efficient.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun lint

      - name: Type check
        run: bun run typecheck

  test-watcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install
        working-directory: apps/watcher

      - name: Run watcher tests
        run: bun test
        working-directory: apps/watcher

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install
        working-directory: apps/web

      - name: Run web tests
        run: bun run test
        working-directory: apps/web

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-watcher, test-web]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build web
        run: bun run build
        working-directory: apps/web
        env:
          # Build with local Supabase URLs for E2E tests
          # (E2E tests run against local Supabase instance)
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
          retention-days: 1

  # E2E tests run on PRs and direct pushes to staging
  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        run: |
          bunx playwright install-deps chromium
          bunx playwright install chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: web-build
          path: apps/web/dist

      # Start Supabase fresh - db reset runs synchronously and creates clean state
      - name: Start Supabase local
        run: |
          npx supabase stop --no-backup 2>/dev/null || true
          npx supabase start
          npx supabase db reset
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Load E2E test fixtures
        run: |
          # Use hardcoded local Supabase DB URL (always the same)
          PGPASSWORD=postgres psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/seed-e2e.sql
          echo "E2E fixtures loaded successfully"

      - name: Run E2E tests
        run: bun run e2e
        working-directory: apps/web
        # Note: VITE_SUPABASE_* are baked into the build at compile time

      - name: Run E2E Data Contract Tests
        run: bun run e2e:data-contracts
        working-directory: apps/web
        timeout-minutes: 5

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Supabase migrations check - steps conditionally run when supabase files change
  db-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for reliable diffs

      - name: Check if DB check needed
        id: check-paths
        run: |
          set -e

          # Determine changed files based on event type
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare against the base branch for pull requests
            CHANGED_FILES="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" || true)"
          else
            # For push events, compare against the previous commit SHA
            BEFORE="${{ github.event.before }}"
            # If there is no previous commit (all-zero SHA), conservatively run the checks
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
              echo "No previous commit detected; running db-migrations to be safe."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CHANGED_FILES="$(git diff --name-only "$BEFORE" "${{ github.sha }}" || true)"
          fi

          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^supabase/'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Supabase files changed - running db-migrations"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No supabase file changes - skipping db-migrations"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check-paths.outputs.should_run == 'true'
        with:
          version: latest

      # Step 1: Start Supabase with minimal services (required for db lint)
      - name: Start Supabase (DB only)
        if: steps.check-paths.outputs.should_run == 'true'
        run: supabase start -x realtime,imgproxy,postgrest,studio,edge-runtime,logflare,vector,supavisor,storage-api,auth

      # Step 2: Lint migrations
      - name: Lint migrations
        if: steps.check-paths.outputs.should_run == 'true'
        run: supabase db lint

      # Step 3: Validate E2E fixtures
      - name: Validate E2E fixtures match schema
        if: steps.check-paths.outputs.should_run == 'true'
        run: |
          # Use hardcoded local Supabase DB URL (always the same)
          PGPASSWORD=postgres psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/seed-e2e.sql || {
            echo "::error::E2E fixtures don't match current schema!"
            echo "::error::Update supabase/seed-e2e.sql to match new columns"
            exit 1
          }
          echo "E2E fixtures validated successfully"
