name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun lint

      - name: Type check
        run: bun run typecheck

  test-watcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install
        working-directory: apps/watcher

      - name: Run watcher tests
        run: bun test
        working-directory: apps/watcher

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install
        working-directory: apps/web

      - name: Run web tests
        run: bun test
        working-directory: apps/web

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-watcher, test-web]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build web
        run: bun run build
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/dist
          retention-days: 1

  # E2E tests run on PRs and main
  e2e:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright deps (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: apps/web/dist

      - name: Start Supabase local
        run: |
          npx supabase stop --no-backup 2>/dev/null || true
          npx supabase start
          npx supabase db reset
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Load E2E test fixtures
        run: |
          # Use hardcoded local Supabase DB URL (always the same)
          PGPASSWORD=postgres psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/seed-e2e.sql
          echo "E2E fixtures loaded successfully"

      - name: Run E2E tests
        run: bun run e2e
        working-directory: apps/web
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          # Standard local Supabase demo anon key (always the same for local dev)
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Supabase migrations check - only runs when supabase files change
  db-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need history to check for changed files

      - name: Check if DB check needed
        id: check-paths
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^supabase/'; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Supabase files changed - running db-migrations"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "No supabase file changes - skipping db-migrations"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.check-paths.outputs.should_run == 'true'
        with:
          version: latest

      # Step 1: Start Supabase with minimal services (required for db lint)
      - name: Start Supabase (DB only)
        if: steps.check-paths.outputs.should_run == 'true'
        run: supabase start -x realtime,imgproxy,postgrest,studio,edge-runtime,logflare,vector,supavisor,storage-api,auth

      # Step 2: Lint migrations
      - name: Lint migrations
        if: steps.check-paths.outputs.should_run == 'true'
        run: supabase db lint

      # Step 3: Validate E2E fixtures
      - name: Validate E2E fixtures match schema
        if: steps.check-paths.outputs.should_run == 'true'
        run: |
          # Use hardcoded local Supabase DB URL (always the same)
          PGPASSWORD=postgres psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -f supabase/seed-e2e.sql || {
            echo "::error::E2E fixtures don't match current schema!"
            echo "::error::Update supabase/seed-e2e.sql to match new columns"
            exit 1
          }
          echo "E2E fixtures validated successfully"
