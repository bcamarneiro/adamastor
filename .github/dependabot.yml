version: 2
updates:
  # "bun", not "npm": with a bun.lock the npm ecosystem tries to run Bun and fails
  # ("Dependabot could not run Bun ... configuration error"), so it could neither
  # update the lockfile in its PRs nor rebase them.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
