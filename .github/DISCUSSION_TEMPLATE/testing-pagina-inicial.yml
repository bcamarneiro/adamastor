labels: ["status:from-qa"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Reportar Bug

        Obrigado por ajudar a melhorar o Adamastor! Preenche os campos abaixo para reportar um problema.

        **Antes de começar**: Procura se este problema já foi reportado em [Discussions existentes](https://github.com/bcamarneiro/adamastor/discussions).

  - type: dropdown
    id: page
    attributes:
      label: Página
      description: Em que página encontraste o problema?
      options:
        - Página Inicial (/)
        - Classificação (/classificacao)
        - Perfil de Deputado (/deputados/...)
        - Parlamento (/parlamento)
        - Batalha Real (/batalha-real)
        - Distritos (/distritos)
        - Partidos (/partidos)
        - Iniciativas (/iniciativas)
        - Calculadora de Desperdício (/calculadora-desperdicio)
        - Outra (especifica abaixo)
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Dispositivo
      description: Onde estás a testar?
      options:
        - Desktop
        - Tablet
        - Mobile (iPhone)
        - Mobile (Android)
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Que browser usaste?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Outro (especifica abaixo)
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: URL completo onde viste o problema (ex https://adamastor-prod.vercel.app/classificacao)
      placeholder: https://adamastor-prod.vercel.app/...
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: O que esperava
      description: Descreve o que deveria acontecer
      placeholder: "Exemplo: Esperava que ao clicar em 'Ordenar' a lista fosse ordenada alfabeticamente"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: O que aconteceu
      description: Descreve o que realmente aconteceu
      placeholder: "Exemplo: Quando clico em 'Ordenar' nada acontece, a lista fica na mesma ordem"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Passos para reproduzir o problema
      placeholder: |
        1. Vou para a página de Classificação
        2. Clico no botão "Ordenar"
        3. Nada acontece
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (opcional)
      description: Arrasta e larga imagens aqui se ajudar a explicar o problema
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Informação Adicional (opcional)
      description: Qualquer outra informação que possa ser útil
      placeholder: "Exemplo: Isto só acontece em mobile, no desktop funciona bem"
    validations:
      required: false
